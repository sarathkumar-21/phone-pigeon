name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not post security problems here**; see SECURITY.md.
        Do not paste message text, phone numbers or keys.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Pairing
        - Messages
        - Calls
        - Photos and videos
        - Files
        - Notifications
        - Screen mirroring or remote control
        - Relay
        - Other
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 15.1, MacBook Air M2
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone model and Android version
      placeholder: Pixel 8, Android 15
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - Same Wi-Fi (LAN)
        - Through a relay
        - Both
        - Not sure
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: "Android: `adb logcat -s PhonePigeon`. Remove anything private."
      render: text
