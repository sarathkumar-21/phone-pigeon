[package]
name = "phonepigeon-desktop"
version = "0.1.0"
description = "PhonePigeon for Windows and Linux: texts, calls, photos and files from your Android phone."
authors = ["PhonePigeon contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "phonepigeon_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "fs"] }
base64 = "0.22"
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
chacha20poly1305 = "0.10"
rand = "0.8"
subtle = "2"
uuid = { version = "1", features = ["v4"] }
mdns-sd = "0.13"
local-ip-address = "0.6"
hostname = "0.4"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
futures-util = "0.3"
dirs = "5"
log = "0.4"
env_logger = "0.11"
hex = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
